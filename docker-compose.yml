# Développement / essai local. Le port n'est publié que sur la boucle locale (VERS_BIND=0.0.0.0 pour l'ouvrir au réseau).
# Production derrière le reverse proxy : docker-compose.prod.yml.
x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  pids_limit: 200

services:
  vers:
    <<: *hardening
    build: .
    image: vers:latest
    depends_on: [vers-server]
    ports:
      - "${VERS_BIND:-127.0.0.1}:${VERS_PORT:-8080}:80"
    # nginx : le maître (root) ouvre le port 80 puis passe la main à l'utilisateur nginx.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Serveur de salons (WebSocket) du mode en ligne : joignable seulement via nginx (`/ws` du service `vers`).
  vers-server:
    <<: *hardening
    build:
      context: .
      dockerfile: server/Dockerfile
    image: vers-server:latest
    environment:
      PORT: "8787"
      MAX_ROOMS: "${VERS_MAX_ROOMS:-200}"
      MAX_CONN_PER_IP: "${VERS_MAX_CONN_PER_IP:-12}"
      ALLOWED_ORIGINS: "${VERS_ALLOWED_ORIGINS:-}"
      GRACE_MS: "${VERS_GRACE_MS:-20000}"
    expose:
      - "8787"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
