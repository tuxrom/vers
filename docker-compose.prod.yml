# Production : derrière nginx-proxy-manager (réseau Docker externe `proxy`), aucun port publié sur l'hôte.
#   docker compose -f docker-compose.prod.yml up --build -d
# Le proxy pointe vers http://vers:80 (WebSocket activé). Voir CLAUDE.md « Reverse proxy externe ».
x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  pids_limit: 200
  networks: [proxy]
  labels:
    com.centurylinklabs.watchtower.enable: "false" # images construites localement

services:
  vers:
    <<: *hardening
    build: .
    image: vers:latest
    container_name: vers
    depends_on: [vers-server]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  vers-server:
    <<: *hardening
    build:
      context: .
      dockerfile: server/Dockerfile
    image: vers-server:latest
    container_name: vers-server
    environment:
      PORT: "8787"
      MAX_ROOMS: "${VERS_MAX_ROOMS:-200}"
      MAX_CONN_PER_IP: "${VERS_MAX_CONN_PER_IP:-12}"
      ALLOWED_ORIGINS: "${VERS_ALLOWED_ORIGINS:-}"
      GRACE_MS: "${VERS_GRACE_MS:-20000}"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
