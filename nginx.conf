# Servi derrière un reverse proxy HTTPS externe (voir README / CLAUDE.md pour les en-têtes attendus).

# Salons en ligne : mise à niveau HTTP → WebSocket (utilisée par le location /ws plus bas).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Récupère l'IP cliente réelle depuis X-Forwarded-For quand la requête vient du reverse proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Types MIME : complète/force ceux de mime.types.
types {
    application/manifest+json webmanifest;
    text/javascript           js mjs;
    image/svg+xml             svg svgz;
    application/wasm          wasm;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;       # pas de redirection vers le port interne derrière le proxy

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    # En-têtes de sécurité (répétés dans chaque location qui ajoute ses propres add_header).
    include /etc/nginx/conf.d/vers-security.inc;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Mode en ligne : WebSocket proxifié vers le service `vers-server` (docker-compose). Le DNS interne de Docker est
    # résolu à chaque requête : nginx démarre même si le serveur de jeu est absent (502 sur /ws seulement).
    location = /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream http://vers-server:8787;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        include /etc/nginx/conf.d/vers-security.inc;
    }

    # Jamais de cache pour le point d'entrée, le service worker et le manifest.
    location = /index.html {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /sw.js {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /registerSW.js {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Fichiers hashés par Vite (/assets/*) et runtime workbox (workbox-<hash>.js) : immuables.
    location /assets/ {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Autres statiques non hashés (icônes…) : revalidation.
    location ~* \.(?:svg|png|ico|webp|jpg|jpeg|woff2?|mp3|ogg|wav)$ {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # Fallback SPA.
    location / {
        include /etc/nginx/conf.d/vers-security.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
